[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toc-forge"
version = "0.3.0"
description = "Automatically convert PDF table-of-contents pages into clickable bookmarks using OCR or optional LLMs"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "pdf",
    "pdf-bookmarks",
    "pdf-outline",
    "table-of-contents",
    "ocr",
    "paddleocr",
    "scanned-pdf",
    "ebook",
    "document-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "paddleocr",
    "paddlex[ocr]",
    "opencv-python",
    "PyMuPDF",
    "Pillow",
    "numpy",
    "scikit-learn",
    "openai",
    "requests",
]

[project.optional-dependencies]
# Select exactly one inference-runtime extra when installing the package.  The
# CPU ONNX Runtime variant is the default/recommended installation target.
paddle-gpu = [
    "paddlepaddle-gpu",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.27,<1.28",
]
onnx-cpu = [
    "onnxruntime>=1.27,<1.28",
]
gui = [
    "sv-ttk",
]
web = [
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.urls]
Homepage = "https://github.com/electroniccc/toc_forge"
Repository = "https://github.com/electroniccc/toc_forge"
Issues = "https://github.com/electroniccc/toc_forge/issues"

[project.scripts]
toc-forge = "toc_forge.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
conflicts = [
    [
        { extra = "paddle-gpu" },
        { extra = "onnx-gpu" },
        { extra = "onnx-cpu" },
    ],
]

[tool.vercel]
entrypoint = "vercel_app:app"
